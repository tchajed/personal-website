<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Publications by Tej Chajed on systems and formal verification." />
    <meta name="author" content="Tej Chajed" />
    <meta name="theme-color" content="#faf7f1" />
    <link rel="canonical" href="https://www.chajed.io/publications/" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✎</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Spectral:ital,wght@0,300;0,400;0,600;1,400&amp;display=swap" rel="stylesheet" />
    <title>All papers · Tej Chajed</title>
  </head>
  <body>
    <main class="page publications-page">
      <div class="notebook">
        <header class="papers-header">
          <a class="back-link" href="/">← Tej Chajed</a>
          <h1>Publications</h1>
          <p>Papers on systems and formal verification.</p>
        </header>

        <div class="papers-tools">
          <div class="paper-search-wrap">
            <label class="sr-only" for="paper-search">Search papers</label>
            <input id="paper-search" type="search" placeholder="title, venue, year, coauthor…" autocomplete="off" />
            <p class="result-count" aria-live="polite"></p>
          </div>
          <button class="text-action" id="download-bibtex" type="button">Download all .bib</button>
        </div>

        <ol class="publication-list all-publications"></ol>

        <footer><span><a href="mailto:tej@theorem.dev">tej@theorem.dev</a> · <a href="https://github.com/tchajed">@tchajed</a> · <a href="https://orcid.org/0000-0002-9889-4828">ORCID</a></span></footer>
      </div>
    </main>

    <dialog id="bibtex-dialog" aria-labelledby="bibtex-title">
      <div class="bibtex-dialog-inner">
        <div class="dialog-heading"><h2 id="bibtex-title">BibTeX</h2><button class="outline-button" id="close-bibtex" type="button">Close ✕</button></div>
        <pre><code id="bibtex-code"></code></pre>
        <button class="outline-button copy-bibtex" id="copy-bibtex" type="button">Copy BibTeX</button>
      </div>
    </dialog>
    <script type="module" src="/src/publications-page.js"></script>
  </body>
</html>
